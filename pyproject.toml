[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bigqmt-data-bridge"
version = "0.2.0a1"
description = "Experimental embedded QMT file bridge with verified K-line downloads"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["pandas>=1.5,<3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
test = ["pytest>=7,<10"]

[project.scripts]
bigqmt-bridge = "bigqmt_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["bigqmt_bridge*", "qmt_bridge*"]

[tool.setuptools.package-data]
bigqmt_bridge = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
